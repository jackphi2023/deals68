name: Business Financial Access Phase A QA

on:
  pull_request:
    paths:
      - 'supabase/migrations/**business_financial_access_phase_a**'
      - 'scripts/deals68-business-financial-access-phase-a-check.mjs'
      - 'scripts/deals68-migration-state-check.mjs'
      - 'docs/release/MIGRATION_STATE.md'
      - 'package.json'
      - '.github/workflows/business-financial-access-phase-a-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Financial access Phase A contract
        run: npm run qa:financial-access-phase-a
      - name: Migration registry contract
        run: npm run qa:migrations
      - name: Production build
        run: npm run build
      - name: CSS architecture regression
        run: npm run qa:css
      - name: Route regression
        run: npm run check:routes
      - name: Diff integrity
        run: git diff --check origin/${{ github.base_ref }}...HEAD
