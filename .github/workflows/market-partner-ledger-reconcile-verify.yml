name: Market Partner Ledger Reconcile Verify

'on':
  pull_request:
    branches: [building]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'feature/market-partner-affiliate-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/market-partner-affiliate-v1
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply production ledger reconciliation
        run: node scripts/_reconcile_market_partner_production_ledger.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build and release QA
        run: |
          npm run build
          npm run qa:release
      - name: Migration, CSS and Market Partner gates
        run: |
          npm run qa:migrations
          npm run qa:css
          npm run qa:public-login-roles
          npm run qa:market-partner-dollar-quotes
          npm run qa:market-partner-v1
          npm run qa:market-partner-phase4
          npm run qa:market-partner-phase5
          git diff --check
      - name: Remove temporary reconciliation files
        run: |
          rm -f scripts/_reconcile_market_partner_production_ledger.mjs
          rm -f .github/workflows/market-partner-ledger-reconcile-verify.yml
      - name: Commit reconciled production tree
        run: |
          git config user.name 'deals68-market-partner-ledger-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --diff-filter=ACMR --name-only | grep -E '(^scripts/_reconcile_market_partner_production_ledger\.mjs$|^\.github/workflows/market-partner-ledger-reconcile-verify\.yml$)'; then
            echo 'Temporary reconciliation files remain'
            exit 1
          fi
          git diff --cached --check
          git commit -m 'chore(migrations): reconcile Market Partner production ledger'
          git push origin HEAD:feature/market-partner-affiliate-v1
