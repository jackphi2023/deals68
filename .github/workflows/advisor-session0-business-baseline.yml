name: Advisor Session 0 - Business Baseline

on:
  push:
    branches: [building]
    paths:
      - 'src/App.tsx'
      - 'src/pages/Login.tsx'
      - 'src/pages/Register.tsx'
      - 'src/pages/BusinessDashboard.tsx'
      - 'src/contexts/AuthContext.tsx'
      - 'src/lib/data.ts'
      - 'src/lib/supabase.ts'
      - 'tests/specs/advisor-session0-business-baseline-contract.json'
      - 'scripts/deals68-advisor-session0-business-baseline-check.mjs'
      - 'package.json'
      - '.github/workflows/advisor-session0-business-baseline.yml'
  pull_request:
    branches: [building, main]
    paths:
      - 'src/App.tsx'
      - 'src/pages/Login.tsx'
      - 'src/pages/Register.tsx'
      - 'src/pages/BusinessDashboard.tsx'
      - 'src/contexts/AuthContext.tsx'
      - 'src/lib/data.ts'
      - 'src/lib/supabase.ts'
      - 'tests/specs/advisor-session0-business-baseline-contract.json'
      - 'scripts/deals68-advisor-session0-business-baseline-check.mjs'
      - 'package.json'
      - '.github/workflows/advisor-session0-business-baseline.yml'

permissions:
  contents: read

concurrency:
  group: advisor-session0-business-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Advisor Session 0 baseline contract
        run: npm run qa:advisor-session0
      - name: Run existing release QA
        run: npm run qa:release
