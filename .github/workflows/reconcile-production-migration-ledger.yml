name: Reconcile Production Migration Ledger

on:
  pull_request:
    branches:
      - migration-ledger-reconciliation-verifier
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply ledger reconciliation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-production-ledger-reconciliation.mjs
          rm scripts/apply-production-ledger-reconciliation.mjs
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Migration registry
        run: npm run qa:migrations
      - name: Premium pricing contract
        run: npm run qa:investor-premium-price-v2
      - name: Phase E contract
        run: npm run qa:financial-release-phase-e
      - name: Cross-feature regressions
        run: |
          npm run qa:investor-plans
          npm run qa:investor-register-plans
          npm run qa:investor-pricing
          npm run qa:admin-investor-plans
          npm run qa:financial-access-phase-a
          npm run qa:financial-redaction-phase-b
          npm run qa:financial-ui-phase-c
          npm run qa:financial-workflow-phase-d
          npm run qa:business-report-ui
          npm run qa:admin-reports
          npm run qa:business-report-phase5
          npm run qa:business-report-phase6
          npm run qa:css
          npm run check:routes
      - name: Diff integrity
        run: |
          git diff --check
          test ! -e scripts/apply-production-ledger-reconciliation.mjs
          test -e supabase/migrations/20260724130742_business_dataroom_access_phase_e_stabilization.sql
          test -e supabase/migrations/20260724130910_investor_premium_price_v2.sql
          test ! -e supabase/migrations/20260724120937_business_dataroom_access_phase_e_stabilization.sql
          test ! -e supabase/migrations/20260724130029_investor_premium_price_v2.sql
      - name: Commit verified reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(migrations): reconcile production ledger versions"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
