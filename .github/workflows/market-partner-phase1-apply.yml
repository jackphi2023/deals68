name: Apply Market Partner Phase 1

on:
  pull_request:
    branches:
      - building
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/market-partner-affiliate-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reconstruct bounded applicator
        run: |
          cat .phase1/chunk_* > /tmp/market-partner-phase1.mjs.gz.b64
          base64 --decode /tmp/market-partner-phase1.mjs.gz.b64 | gunzip > /tmp/apply-market-partner-phase1.mjs
          node --check /tmp/apply-market-partner-phase1.mjs

      - name: Create migration with Supabase CLI and apply source patch
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest --version
          npx --yes supabase@latest migration --help >/tmp/supabase-migration-help.txt
          npx --yes supabase@latest migration new market_partner_affiliate_phase1_v1
          export D68_MIGRATION_PATH="$(ls -t supabase/migrations/*_market_partner_affiliate_phase1_v1.sql | head -1)"
          test -n "$D68_MIGRATION_PATH"
          node /tmp/apply-market-partner-phase1.mjs
          rm -rf .phase1 supabase/.temp
          rm -f .github/workflows/market-partner-phase1-apply.yml

      - name: Install dependencies
        run: npm ci

      - name: Required Phase 1 QA
        run: |
          npm run build
          npm run qa:release
          npm run qa:css
          npm run qa:migrations
          node scripts/qa-market-partner-v1.mjs

      - name: Scope and diff integrity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin building
          git diff --check
          test ! -e .phase1
          test ! -e .github/workflows/market-partner-phase1-apply.yml
          test ! -d supabase/.temp
          git diff --name-only origin/building > /tmp/changed.txt
          cat /tmp/changed.txt
          while IFS= read -r file; do
            case "$file" in
              src/App.tsx|src/pages/Admin.tsx|src/config/adminNavigation.ts|src/lib/marketPartners.ts|src/styles/pages/admin.css|scripts/qa-market-partner-v1.mjs|package.json) ;;
              supabase/migrations/*_market_partner_affiliate_phase1_v1.sql) ;;
              *) echo "Out-of-scope Phase 1 file: $file"; exit 1 ;;
            esac
          done < /tmp/changed.txt
          test "$(grep -c '_market_partner_affiliate_phase1_v1.sql$' /tmp/changed.txt)" -eq 1

      - name: Commit verified Phase 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982982+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(market-partner): add secure affiliate Phase 1 foundation"
          git push origin HEAD:feature/market-partner-affiliate-v1
