name: Market Partner Demo Wording Apply

'on':
  pull_request:
    branches: [building]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'feature/market-partner-demo-wording-v1-active'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/market-partner-demo-wording-v1-active
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply requested wording
        run: node scripts/_apply_market_partner_demo_wording.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build and QA
        run: |
          npm run build
          npm run qa:release
          npm run qa:css
          npm run qa:migrations
          npm run qa:market-partner-demo
          git diff --check
      - name: Remove temporary files
        run: |
          rm -f scripts/_apply_market_partner_demo_wording.mjs
          rm -f .github/workflows/market-partner-demo-wording-apply.yml
      - name: Commit verified implementation
        run: |
          git config user.name 'deals68-market-partner-demo-wording-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(market-partner): update demo dashboard wording'
          git push origin HEAD:feature/market-partner-demo-wording-v1-active
