name: NEWS-08 Final Fixture Patch

on:
  push:
    branches: [building]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: building
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch duplicate PostgREST slug filters in NEWS-08 fixture
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'tests/e2e/07-news-v1.spec.ts';
          let source = fs.readFileSync(file, 'utf8');
          const replacements = [
            ["const viSlug = url.searchParams.get('slug_vi');", "const viSlug = url.searchParams.getAll('slug_vi').find((value) => value.startsWith('eq.'));"],
            ["const enSlug = url.searchParams.get('slug_en');", "const enSlug = url.searchParams.getAll('slug_en').find((value) => value.startsWith('eq.'));"],
          ];
          for (const [from, to] of replacements) {
            if (!source.includes(from)) throw new Error(`Expected fixture line not found: ${from}`);
            source = source.replace(from, to);
          }
          fs.writeFileSync(file, source);
          NODE
      - run: npm ci
      - name: Verify no high or critical production advisory remains
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/news08-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/news08-audit.json', 'utf8'));
          const blocking = Object.entries(audit.vulnerabilities || {})
            .filter(([, value]) => ['high', 'critical'].includes(String(value?.severity || '').toLowerCase()));
          console.log('Production audit metadata:', JSON.stringify(audit.metadata?.vulnerabilities || {}, null, 2));
          if (blocking.length) {
            console.error('Blocking production advisories:', JSON.stringify(blocking, null, 2));
            process.exit(1);
          }
          console.log('PASS no high/critical production advisories.');
          NODE
      - name: Commit fixture fix
        shell: bash
        run: |
          git diff -- tests/e2e/07-news-v1.spec.ts
          git add tests/e2e/07-news-v1.spec.ts
          if git diff --cached --quiet; then
            echo "No fixture change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(news): handle duplicate PostgREST slug filters"
          git push origin HEAD:building
