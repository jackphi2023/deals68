name: NEWS-08 Dependency Refresh

on:
  push:
    branches: [building]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: building
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh audited runtime dependencies
        run: npm install --save-exact @supabase/supabase-js@2.109.0 react-router-dom@6.30.4
      - name: Keep build-only tooling in devDependencies
        run: npm install --save-dev --save-exact vite@5.4.21 typescript@5.6.3 @vitejs/plugin-react@4.3.4
      - name: Apply non-breaking transitive audit fixes
        run: npm audit fix || true
      - name: Verify no high or critical production advisory remains
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/news08-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/news08-audit.json', 'utf8'));
          const vulnerabilities = audit.vulnerabilities || {};
          const blocking = Object.entries(vulnerabilities)
            .filter(([, value]) => ['high', 'critical'].includes(String(value?.severity || '').toLowerCase()))
            .map(([name, value]) => ({ name, severity: value.severity, via: value.via }));
          console.log('Production audit metadata:', JSON.stringify(audit.metadata?.vulnerabilities || {}, null, 2));
          if (blocking.length) {
            console.error('Blocking production advisories:', JSON.stringify(blocking, null, 2));
            process.exit(1);
          }
          console.log('PASS no high/critical production advisories.');
          NODE
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          git diff -- package.json package-lock.json
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh secure release dependencies"
          git push origin HEAD:building
