name: Market Partner Final Repair Verify

'on':
  pull_request:
    branches: [building]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'feature/market-partner-affiliate-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/market-partner-affiliate-v1
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Repair and verify SQL dollar quotes
        run: |
          node scripts/_fix_market_partner_phase1_dollar_quote.mjs
          npm run qa:market-partner-dollar-quotes
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Public Login role contract
        run: npm run qa:public-login-roles
      - name: Base release QA
        run: |
          node scripts/deals68-release-qa-check.mjs
          npm run qa:packages
      - name: CSS and migration QA
        run: |
          npm run qa:css
          npm run qa:migrations
      - name: Market Partner Phase 1-3 QA
        run: npm run qa:market-partner-v1
      - name: Market Partner Phase 4 QA
        run: npm run qa:market-partner-phase4
      - name: Market Partner Phase 5 QA
        run: npm run qa:market-partner-phase5
      - name: Diff integrity
        run: git diff --check
      - name: Remove temporary repair files
        run: |
          rm -f scripts/_fix_market_partner_phase1_dollar_quote.mjs
          rm -f .github/workflows/market-partner-final-repair-verify.yml
      - name: Commit verified repaired tree
        run: |
          git config user.name 'deals68-market-partner-final-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --diff-filter=ACMR --name-only | grep -E '(^scripts/_fix_market_partner_phase1_dollar_quote\.mjs$|^\.github/workflows/market-partner-final-repair-verify\.yml$)'; then
            echo 'Temporary repair files remain'
            exit 1
          fi
          git diff --cached --check
          git commit -m 'fix(market-partner): finalize Phase 1-5 SQL quoting'
          git push origin HEAD:feature/market-partner-affiliate-v1
