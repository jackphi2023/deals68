name: Market Partner Phase 5 Hardening Verify

'on':
  pull_request:
    branches: [building]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'feature/market-partner-affiliate-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/market-partner-affiliate-v1
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Partner activation preflight hardening
        run: node scripts/_apply_market_partner_phase5_activation_preflight.mjs
      - run: npm ci
      - name: Required final Phase 1-5 QA
        run: |
          npm run build
          npm run qa:release
          npm run qa:css
          npm run qa:migrations
          node scripts/qa-market-partner-v1.mjs
          node scripts/qa-market-partner-phase4.mjs
          node scripts/qa-market-partner-phase5.mjs
          git diff --check
      - name: Remove temporary hardening files
        run: |
          rm -f scripts/_apply_market_partner_phase5_activation_preflight.mjs
          rm -f docs/release/.market-partner-phase5-hardening-trigger
          rm -f .github/workflows/market-partner-phase5-hardening-verify.yml
      - name: Commit verified hardening tree
        run: |
          git config user.name 'deals68-phase5-hardening-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --diff-filter=ACMR --name-only | grep -E '(^scripts/_apply_market_partner_phase5_activation_preflight\.mjs$|^docs/release/\.market-partner-phase5-hardening-trigger$|^\.github/workflows/market-partner-phase5-hardening-verify\.yml$)'; then
            echo 'Temporary hardening files remain'
            exit 1
          fi
          git diff --cached --check
          git commit -m 'fix(market-partner): preflight Partner activation before Auth signup'
          git push origin HEAD:feature/market-partner-affiliate-v1
