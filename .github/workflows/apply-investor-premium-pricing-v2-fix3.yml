name: Apply Investor Premium Pricing V2 Fix3

on:
  pull_request:
    branches:
      - investor-premium-pricing-v2-orchestrator-final
    types: [synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch with bounded regex anchor normalization
        if: hashFiles('scripts/apply-investor-premium-pricing-v2.mjs') != ''
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.101.0 migration new investor_premium_price_v2
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/apply-investor-premium-pricing-v2.mjs')
          text = p.read_text()
          text, n1 = re.subn(
              r"orderType: 'investor_service_upgrade',\n\s+role: 'investor',",
              "orderType: 'investor_service_upgrade',\n      role: 'investor',",
              text,
              count=1,
          )
          text, n2 = re.subn(
              r'</h3>\n\n\s+<div className="d68-bizreg-paygrid">',
              '</h3>\n\n          <div className="d68-bizreg-paygrid">',
              text,
              count=1,
          )
          text, n3 = re.subn(
              r"<span>\{T\(lang, 'Tạm tính', 'Estimate'\)\}</span>\n\s+<div>",
              "<span>{T(lang, 'Tạm tính', 'Estimate')}</span>\n              <div>",
              text,
              count=1,
          )
          if (n1, n2, n3) != (1, 1, 1):
              raise SystemExit(f'Unexpected applicator anchor counts: {(n1, n2, n3)}')
          p.write_text(text)
          PY
          MIGRATION_PATH="$(ls -1t supabase/migrations/*_investor_premium_price_v2.sql | head -n 1)"
          set +e
          node scripts/apply-investor-premium-pricing-v2.mjs "$MIGRATION_PATH" >/tmp/apply.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/apply.log
          if [ "$STATUS" -ne 0 ]; then
            printf '### Pricing V2 applicator error\n\n```text\n%s\n```\n' "$(tail -n 14 /tmp/apply.log)" > /tmp/comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
            exit "$STATUS"
          fi
          rm scripts/apply-investor-premium-pricing-v2.mjs
          rm -f scripts/pricing-v2-diagnostic-marker.txt
          rm -rf supabase/.temp
      - run: npm ci
      - run: npm run build
      - name: Focused contracts
        run: |
          npm run qa:investor-plans
          npm run qa:investor-register-plans
          npm run qa:investor-pricing
          npm run qa:investor-premium-price-v2
          npm run qa:admin-investor-plans
          npm run qa:migrations
          npm run check:routes
          git diff --check
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(pricing): update Investor Premium monthly rates"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
