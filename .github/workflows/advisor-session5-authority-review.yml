name: Advisor Session 5 - Admin Authority Review

on:
  push:
    branches:
      - building
      - 'agent/advisor-session5-*'
  pull_request:
    branches:
      - building
    paths:
      - 'src/pages/AdminAdvisorIntakes.tsx'
      - 'src/components/AdminAdvisorIntakeCard.tsx'
      - 'src/lib/adminAdvisorIntakes.ts'
      - 'src/config/adminNavigation.ts'
      - 'src/main.tsx'
      - 'src/styles/pages/admin-advisor-intakes.css'
      - 'supabase/migrations/20260806203000_advisor_authority_review_phase5_v1.sql'
      - 'scripts/deals68-advisor-session5-*.mjs'
      - 'package.json'
      - '.github/workflows/advisor-session5-authority-review.yml'

jobs:
  advisor-authority-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Advisor Session 5 Admin review contract
        run: npm run qa:advisor-session5
      - name: Re-run Session 0 Business baseline
        run: npm run qa:advisor-session0
      - name: Re-run Session 1 assignment security
        run: npm run qa:advisor-session1
      - name: Re-run Session 2 authentication
        run: npm run qa:advisor-session2
      - name: Re-run Session 3 read-only portfolio
        run: npm run qa:advisor-session3
      - name: Re-run Session 4 atomic intake
        run: npm run qa:advisor-session4
      - name: Run existing release QA
        run: npm run qa:release
