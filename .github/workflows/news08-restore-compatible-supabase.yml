name: NEWS-08 Restore Compatible Supabase

on:
  push:
    branches: [building]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: building
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore known-compatible Supabase SDK
        run: npm install --save-exact @supabase/supabase-js@2.45.4
      - name: Verify repository builds before committing lockfile
        run: npm run build
      - name: Commit only package manifest and lockfile
        shell: bash
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency rollback needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: restore compatible Supabase SDK"
          git push origin HEAD:building
