name: Apply Phase C Financial UI

on:
  pull_request:
    branches:
      - phase-c-ui-orchestrator
    paths:
      - tools/apply_phase_c.py
      - tools/patch_phase_b_qa.py
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply reviewed Phase C source changes
        run: |
          python3 tools/apply_phase_c.py
          python3 tools/patch_phase_b_qa.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Phase B regression QA
        run: npm run qa:financial-redaction-phase-b

      - name: Phase C UI QA
        run: npm run qa:financial-ui-phase-c

      - name: Commit verified source only
        run: |
          rm -f tools/apply_phase_c.py tools/patch_phase_b_qa.py .github/workflows/apply-phase-c-financial-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(financials): finalize protected financial UI phase C"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
