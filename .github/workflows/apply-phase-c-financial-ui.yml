name: Apply Phase C Financial UI

on:
  push:
    branches:
      - feature/financial-ui-phase-c-v1
    paths:
      - tools/phase-c-ui.patch

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase C branch
        uses: actions/checkout@v4
        with:
          ref: feature/financial-ui-phase-c-v1
          fetch-depth: 0

      - name: Apply reviewed Phase C patch
        run: |
          git apply --check --recount tools/phase-c-ui.patch
          git apply --recount tools/phase-c-ui.patch

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Phase B regression QA
        run: npm run qa:financial-redaction-phase-b

      - name: Phase C UI QA
        run: npm run qa:financial-ui-phase-c

      - name: Commit verified source only
        run: |
          rm -f tools/phase-c-ui.patch .github/workflows/apply-phase-c-financial-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(financials): finalize protected financial UI phase C"
          git push origin HEAD:feature/financial-ui-phase-c-v1
