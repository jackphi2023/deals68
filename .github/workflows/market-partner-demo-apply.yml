name: Market Partner Demo Apply

'on':
  push:
    branches: [feature/market-partner-demo-static-v1]
    paths:
      - 'scripts/_apply_market_partner_demo_routes.mjs'
      - '.github/workflows/market-partner-demo-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/market-partner-demo-static-v1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply route wiring
        run: node scripts/_apply_market_partner_demo_routes.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build and full release QA
        run: |
          npm run build
          npm run qa:release
          npm run qa:css
          npm run qa:migrations
          npm run qa:market-partner-demo
          git diff --check
      - name: Remove temporary applicator files
        run: |
          rm -f scripts/_apply_market_partner_demo_routes.mjs
          rm -f .github/workflows/market-partner-demo-apply.yml
          rm -f docs/release/.market-partner-demo-trigger
      - name: Commit verified implementation
        run: |
          git config user.name 'deals68-market-partner-demo-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(market-partner): add static demo account and dashboard'
          git push origin HEAD:feature/market-partner-demo-static-v1
