name: Market Partner Wording Sync v2

'on':
  pull_request:
    branches: [building]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'feature/market-partner-wording-sync-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/market-partner-wording-sync-v2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply wording and public-title updates
        run: node scripts/_apply_market_partner_wording_sync_v2.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Release QA
        run: npm run qa:release
      - name: CSS architecture QA
        run: npm run qa:css
      - name: Migration registry QA
        run: npm run qa:migrations
      - name: Market Partner demo and wording contract
        run: npm run qa:market-partner-demo
      - name: Diff integrity
        run: git diff --check
      - name: Remove temporary files
        run: |
          rm -f scripts/_apply_market_partner_wording_sync_v2.mjs
          rm -f .github/workflows/market-partner-wording-sync-v2.yml
      - name: Commit verified implementation
        run: |
          git config user.name 'deals68-market-partner-wording-sync-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(market-partner): synchronize demo and user dashboard wording'
          git push origin HEAD:feature/market-partner-wording-sync-v2
