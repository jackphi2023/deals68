name: NEWS-08 Supabase Compatibility

on:
  push:
    branches: [building]

permissions:
  contents: read

jobs:
  compatibility:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        supabase: ['2.99.0', '2.100.0', '2.103.0', '2.106.2']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install candidate without changing repo lockfile
        run: npm install --no-save --package-lock=false @supabase/supabase-js@${{ matrix.supabase }}
      - name: Print resolved Supabase package versions
        shell: bash
        run: |
          node -e "for (const p of ['@supabase/supabase-js','@supabase/auth-js','@supabase/postgrest-js']) console.log(p, require(p + '/package.json').version)"
      - name: Build repository with candidate
        run: npm run build
      - name: Audit candidate production graph in isolated manifest
        shell: bash
        run: |
          rm -rf /tmp/news08-candidate && mkdir -p /tmp/news08-candidate
          cd /tmp/news08-candidate
          cat > package.json <<JSON
          {"private":true,"dependencies":{"@supabase/supabase-js":"${{ matrix.supabase }}","react":"18.3.1","react-dom":"18.3.1","react-router-dom":"6.30.4","lucide-react":"0.468.0"}}
          JSON
          npm install --package-lock-only --ignore-scripts --silent
          npm audit --omit=dev --json > audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json','utf8'));
          const blocking = Object.entries(audit.vulnerabilities || {})
            .filter(([, value]) => ['high','critical'].includes(String(value?.severity || '').toLowerCase()));
          console.log('audit metadata', JSON.stringify(audit.metadata?.vulnerabilities || {}, null, 2));
          if (blocking.length) {
            console.error('BLOCKING', JSON.stringify(blocking, null, 2));
            process.exit(1);
          }
          console.log('PASS no high/critical production advisories');
          NODE
